name: Generate environments documentation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate-variables-documentation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the default branch with the write token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          persist-credentials: true

      # CONFIG_READER_TOKEN is a repository Actions secret, scoped to this step.
      # See README.md for the minimum read-only repository permissions.
      # Sensitive information belongs in Secrets, NOT Environment Variables:
      # variable values are intentionally published in Variables.md and Git history.
      - name: Generate Variables.md using the read-only configuration token
        env:
          GH_TOKEN: ${{ secrets.CONFIG_READER_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/generate-variables-documentation.sh

      - name: Commit and push only Variables.md using GITHUB_TOKEN
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # git diff alone does not detect an untracked file on the first run.
          if git diff --quiet -- Variables.md &&
             git ls-files --error-unmatch -- Variables.md >/dev/null 2>&1; then
            echo "No hubo cambios en Variables.md."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Variables.md
          git commit -m "docs: update environments variables and secrets" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
